name: Agent Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build Windows agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-go
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Download Go modules
        run: go mod download
      - name: Verify Go modules
        run: go mod verify
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/anydesk-killer-agent-windows-amd64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: anydesk-killer-agent-windows-amd64
          path: dist/anydesk-killer-agent-windows-amd64.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: agent-go
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Download Go modules
        run: go mod download
      - run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/anydesk-killer-agent-windows-amd64.exe .
      - run: |
          cd ../dist
          zip anydesk-killer-agent-windows-amd64.zip anydesk-killer-agent-windows-amd64.exe
          sha256sum anydesk-killer-agent-windows-amd64.zip > anydesk-killer-agent-windows-amd64.zip.sha256
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ../dist/anydesk-killer-agent-windows-amd64.zip ../dist/anydesk-killer-agent-windows-amd64.zip.sha256 --generate-notes --title "$GITHUB_REF_NAME"
