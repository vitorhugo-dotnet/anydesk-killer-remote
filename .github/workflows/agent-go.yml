name: Agent Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build Windows agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-go
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Tidy Go modules
        run: go mod tidy
      - name: Verify Go modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Check Python agent syntax
        run: python3 -m py_compile ../agent/kill_anydesk_agent.pyw
      - name: Build Windows agent package
        run: |
          mkdir -p ../dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/anydesk-killer-agent-windows-amd64.exe .
          cp windows/install-startup.bat ../dist/
          cp windows/uninstall-startup.bat ../dist/
          cp windows/run-agent-hidden.vbs ../dist/
          cp ../agent/config.example.json ../dist/config.example.json
      - uses: actions/upload-artifact@v4
        with:
          name: anydesk-killer-agent-windows-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: anydesk-killer-agent-windows-amd64
          path: dist
      - name: Package release files
        run: |
          cd dist
          zip anydesk-killer-agent-windows-amd64.zip \
            anydesk-killer-agent-windows-amd64.exe \
            install-startup.bat \
            uninstall-startup.bat \
            run-agent-hidden.vbs \
            config.example.json
          sha256sum \
            anydesk-killer-agent-windows-amd64.exe \
            anydesk-killer-agent-windows-amd64.zip \
            install-startup.bat \
            uninstall-startup.bat \
            run-agent-hidden.vbs \
            config.example.json \
            > checksums.sha256
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.0.${{ github.run_number }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/anydesk-killer-agent-windows-amd64.exe \
              dist/anydesk-killer-agent-windows-amd64.zip \
              dist/checksums.sha256 \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              dist/anydesk-killer-agent-windows-amd64.exe \
              dist/anydesk-killer-agent-windows-amd64.zip \
              dist/checksums.sha256 \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
